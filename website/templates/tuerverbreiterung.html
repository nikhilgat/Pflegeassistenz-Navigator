  <!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Türverbreiterung-Konfigurator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-body text-center">
                        <h2 class="card-title">Türverbreiterung</h2>
                        <p class="text-muted">Gib die relevante Türbreite ein, um eine rollstuhlgerechte Lösung zu erhalten.</p>
                        
                        <div class="mb-3">
                            <img src="static/tuerverbreiterung.jpg" alt="Türverbreiterung" class="img-fluid rounded shadow-sm">
                        </div>
                        
                        <div class="mb-3">
                            <label for="width" class="form-label">Lichte Türbreite (cm)</label>
                            <input type="number" id="width" class="form-control" placeholder="z. B. 85" min="0">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Gibt es tragende Bauelemente angrenzend an die Tür?</label>
                            <select id="supporting" class="form-select">
                                <option value="no">Nein</option>
                                <option value="yes">Ja</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mindest-Bewegungsfläche gegeben? (120-150 cm x 190 cm)</label>
                            <select id="movement" class="form-select">
                                <option value="yes">Ja</option>
                                <option value="no">Nein</option>
                            </select>
                        </div>

                        <button class="btn btn-primary w-100" onclick="calculateSolution()">Lösung anzeigen</button>
                        
                        <div class="alert alert-info mt-3 d-none" id="result"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function calculateSolution() {
            let width = parseFloat(document.getElementById("width").value);
            let supporting = document.getElementById("supporting").value;
            let movement = document.getElementById("movement").value;
            let resultDiv = document.getElementById("result");

            if (isNaN(width) || width <= 0) {
                resultDiv.innerText = "Bitte eine gültige Türbreite eingeben!";
                resultDiv.classList.remove("d-none", "alert-success");
                resultDiv.classList.add("alert-danger");
                return;
            }

            let resultText = "";
            
            if (width >= 90) {
                resultText = "Keine Maßnahme erforderlich.";
            } else if (width >= 85 && width < 90) {
                resultText = "Neue Türzarge + Türblatt zur Verkleinerung des Türanschlags (ca. 1-3 cm zusätzliche Breite).";
            } else {
                if (supporting === "yes") {
                    resultText = "Prüfung durch Tragwerksplaner notwendig. Umbau ggf. möglich.";
                } else {
                    if (movement === "yes") {
                        resultText = "Neue Schiebetür einbauen für mehr Durchgangsbreite.";
                    } else {
                        resultText = "Alte Tür entfernen, Rohbauöffnung vergrößern, neue Tür einsetzen.";
                    }
                }
            }
            
            resultDiv.innerText = resultText;
            resultDiv.classList.remove("d-none", "alert-danger");
            resultDiv.classList.add("alert-success");
        }
    </script>
</body>
</html>
