{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}

<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Instrument Sans', sans-serif;
    }
</style>
<div class="max-w-md mx-auto">
    <div class="bg-white rounded-lg shadow-lg p-8">
        <h2 class="text-xl font-bold text-center text-gray-800 mb-8">Anmeldung</h2>
        <form method="POST">
            <div class="space-y-6">
                <div>
                    <label for="unique_id" class="block text-sm font-medium text-gray-700 mb-2">
                        Ihre eindeutige Kennung erhalten Sie nach Registrierung per E-Mail
                    </label>
                    <input type="text" id="unique_id" name="unique_id" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button id="loginButton" type="submit" disabled
                    class="w-full bg-gray-400 text-white py-2 px-4 rounded-md font-medium cursor-not-allowed">
                    Anmeldung
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const uniqueIdInput = document.getElementById('unique_id');
        const loginButton = document.getElementById('loginButton');

        function toggleButtonState() {
            if (uniqueIdInput.value.trim() !== '') {
                loginButton.disabled = false;
                loginButton.classList.remove('bg-gray-400', 'cursor-not-allowed');
                loginButton.classList.add('bg-blue-500', 'hover:bg-blue-600');
            } else {
                loginButton.disabled = true;
                loginButton.classList.remove('bg-blue-500', 'hover:bg-blue-600');
                loginButton.classList.add('bg-gray-400', 'cursor-not-allowed');
            }
        }

        uniqueIdInput.addEventListener('input', toggleButtonState);
    });
</script>



{% endblock %}
