<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Schwellen-Konfigurator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-body text-center">
                        <h2 class="card-title"> schwellenlose Zugänge schaffen</h2>
                        <p class="text-muted">Gib die relevante Schwellenhöhe ein, um eine Lösung zu erhalten.</p>

                        <!-- Bild Ã¼ber dem Eingabefeld -->
                        <div class="mb-3">
                            <img src="/static/schwelle.jpg" alt="Schwellen-Beispiel" class="img-fluid rounded shadow-sm">
                        </div>

                        <!-- Eingabefeld fÃ¼r SchwellenhÃ¶he -->
                        <div class="mb-3">
                            <label for="height" class="form-label">Schwellenhöhe (mm)</label>
                            <input type="number" id="height" class="form-control" placeholder="z. B. 15" min="0">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Ist der Untergrund eben und glatt?</label>
                            <select id="surface" class="form-select">
                                <option value="yes">Ja</option>
                                <option value="no">Nein</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Muss die Tür geschlossen werden können?</label>
                            <select id="door" class="form-select">
                                <option value="yes">Ja</option>
                                <option value="no">Nein</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Wird eine temporäre/kostengünstige Lösung gewünscht?</label>
                            <select id="temporary" class="form-select">
                                <option value="no">Nein</option>
                                <option value="yes">Ja</option>
                            </select>
                        </div>

                        <!-- Button -->
                        <button class="btn btn-primary w-100" onclick="calculateSolution()">Lösung anzeigen</button>

                        <!-- Ergebnisanzeige -->
                        <div class="alert alert-info mt-3 d-none" id="result"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-primary text-white text-center py-3 mt-5">
        B4C - Hochschule Darmstadt
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript fÃ¼r Berechnung -->
    <script>
        function calculateSolution() {
            let height = parseFloat(document.getElementById("height").value);
            let surface = document.getElementById("surface").value;
            let door = document.getElementById("door").value;
            let temporary = document.getElementById("temporary").value;
            let resultDiv = document.getElementById("result");

            if (isNaN(height) || height < 0) {
                resultDiv.innerText = "Bitte eine gültige Schwellenhöhe eingeben!";
                resultDiv.classList.remove("d-none", "alert-success");
                resultDiv.classList.add("alert-danger");
                return;
            }

            let resultText = "";

            // Entscheidungslogik
            if (height == 0) {
                resultText = "Keine Maßnahme erforderlich.";
            } else if (height > 4 && height <= 12) {
                resultText = "Übergangs- und Ausgleichsprofile empfohlen.";
            } else if (height > 12 && height <= 20) {
                resultText = "Flache Türschwellenrampe oder Keilrampe geeignet.";
            } else if (height > 20 && height <= 120) {
                resultText = "Modulare Rampensysteme sind eine Option.";
            } else if (height > 120 && height <= 150) {
                if (temporary === "yes") {
                    resultText = "TemporÃ¤re Lösung: Schwellenlose Brücke.";
                } else {
                    resultText = "Schwellenbrücke oder klappbare Brücke erforderlich.";
                }
            } else {
                resultText = "Sonderanfertigung nötig, um die Schwelle sicher zu Überwinden.";
            }

            // ZusÃ¤tzliche Bedingungen fÃ¼r Untergrund und TÃ¼r
            if (surface === "no" && height > 12) {
                resultText += " Der Untergrund ist uneben, daher ist eine Anpassung erforderlich.";
            }

            if (door === "yes" && height > 4) {
                resultText += " Die Tür muss geschlossen bleiben, daher Schwellenbrücke oder Rampe mit passender Höhe nutzen.";
            }

            // Ergebnis anzeigen
            resultDiv.innerText = resultText;
            resultDiv.classList.remove("d-none", "alert-danger");
            resultDiv.classList.add("alert-success");
        }
    </script>

</body>
</html>
